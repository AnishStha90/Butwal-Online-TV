<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Butwal Today Online TV - News</title>
  <link rel="icon" type="image/png" href="images/headerlogo.png?v3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; flex-direction: column;
      overflow-x: hidden;
      background: #FFFFFF;
      color: #1D1D1D;
      font-family: 'Hind Siliguri',sans-serif;
    }
    img, video, iframe { max-width: 100%; height: auto; }

    main {
      flex: 1;
      margin-left: var(--bt-sidebar-w, 264px);
      width: calc(100% - var(--bt-sidebar-w, 264px));
      box-sizing: border-box;
      transition: margin-left .25s ease, width .25s ease;
    }
    footer#site-footer {
      margin-left: var(--bt-sidebar-w, 264px);
      width: calc(100% - var(--bt-sidebar-w, 264px));
      max-width: calc(100% - var(--bt-sidebar-w, 264px));
      box-sizing: border-box;
      transition: margin-left .25s ease, width .25s ease;
    }
    body.sidebar-collapsed main,
    body.sidebar-collapsed footer#site-footer {
      margin-left: var(--bt-sidebar-w-collapsed, 76px);
      width: calc(100% - var(--bt-sidebar-w-collapsed, 76px));
      max-width: calc(100% - var(--bt-sidebar-w-collapsed, 76px));
    }
   @media (max-width: 900px) {
      main, footer#site-footer {
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      #bt-header {
        min-height: auto !important;
      }
    }

    .lang-en { display: inline !important; }
    .lang-np { display: none !important; }
    div.lang-en, p.lang-en, section.lang-en,
    h1.lang-en, h2.lang-en, h3.lang-en, h4.lang-en,
    li.lang-en { display: block !important; }
    div.lang-np, p.lang-np, section.lang-np,
    h1.lang-np, h2.lang-np, h3.lang-np, h4.lang-np,
    li.lang-np { display: none !important; }

    body.lang-active .lang-en { display: none !important; }
    body.lang-active .lang-np { display: inline !important; }
    body.lang-active div.lang-np, body.lang-active p.lang-np,
    body.lang-active section.lang-np, body.lang-active h1.lang-np,
    body.lang-active h2.lang-np, body.lang-active h3.lang-np,
    body.lang-active h4.lang-np, body.lang-active li.lang-np { display: block !important; }
    body.lang-active div.lang-en, body.lang-active p.lang-en,
    body.lang-active section.lang-en, body.lang-active h1.lang-en,
    body.lang-active h2.lang-en, body.lang-active h3.lang-en,
    body.lang-active h4.lang-en, body.lang-active li.lang-en { display: none !important; }

    body.lang-active #bt-header .lang-np,
    body.lang-active #bt-header span.lang-np,
    body.lang-active #bt-header div.lang-np { display: inline !important; }
    body.lang-active #bt-header .lang-en,
    body.lang-active #bt-header span.lang-en,
    body.lang-active #bt-header div.lang-en { display: none !important; }
    #bt-header .lang-np,
    #bt-header span.lang-np,
    #bt-header div.lang-np { display: none !important; }
    #bt-header .lang-en,
    #bt-header span.lang-en,
    #bt-header div.lang-en { display: inline !important; }

    .page-container {
      max-width: none !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 28px !important;
      box-sizing: border-box !important;
    }
    @media (max-width: 480px) {
      .page-container {
        padding: 0 16px !important;
      }
    }

    .section-grid,
    .section-grid.has-featured,
    .section-grid.latest-grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)) !important;
      gap: 20px !important;
    }
    @media (max-width: 480px) {
      .section-grid, .section-grid.has-featured, .section-grid.latest-grid {
        grid-template-columns: repeat(1, 1fr) !important;
        gap: 14px !important;
      }
    }
    .news-card.featured,
    .news-card.latest {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
    }
    .news-card.featured > a,
    .news-card.latest > a {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
    }
    .news-card.featured .card-body,
    .news-card.latest .card-body {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 1 auto !important;
    }
    body:not(.lang-active) .news-card.featured .card-title.lang-en,
    body:not(.lang-active) .news-card.latest .card-title.lang-en,
    body.lang-active .news-card.featured .card-title.lang-np,
    body.lang-active .news-card.latest .card-title.lang-np {
      display: -webkit-box !important;
      min-height: 2.9em !important;
      -webkit-line-clamp: 2 !important;
      -webkit-box-orient: vertical !important;
      overflow: hidden !important;
    }

    body:not(.lang-active) .news-card.featured .card-title.lang-np,
    body:not(.lang-active) .news-card.latest .card-title.lang-np,
    body.lang-active .news-card.featured .card-title.lang-en,
    body.lang-active .news-card.latest .card-title.lang-en {
      display: none !important;
    }
    .news-card.featured .card-date,
    .news-card.latest .card-date {
      margin-top: auto !important;
    }

    .card-date {
      font-size: .72rem !important;
      color: rgba(31,31,31,.55) !important;
      display: flex !important;
      align-items: center !important;
      gap: 4px !important;
    }
    .cat-badge {
      display: inline-block !important;
      background: #A31919 !important;
      color: #FFFFFF !important;
      font-size: .62rem !important;
      font-weight: 800 !important;
      padding: 2px 8px !important;
      border-radius: 2px !important;
      margin-bottom: 6px !important;
      text-transform: uppercase !important;
      letter-spacing: .06em !important;
    }

    .news-card.featured,
    .news-card.latest {
      background: #FFFFFF !important;
      border: 1px solid #E0E0E0 !important;
      border-radius: 6px !important;
      overflow: hidden !important;
      width: 100% !important;
    }
    .news-card.featured > a,
    .news-card.latest > a {
      text-decoration: none !important;
      color: inherit !important;
    }

    .news-card.featured .card-title-link,
    .news-card.latest .card-title-link {
      text-decoration: none !important;
      color: inherit !important;
      display: block !important;
    }

    .news-card.featured .card-img,
    .news-card.latest .card-img {
      display: block !important;
      width: 100% !important;
      height: 170px !important;
      position: relative !important;
      overflow: hidden !important;
      background: #000 !important;
      flex-shrink: 0 !important;
    }
    .news-card.featured .card-img img,
    .news-card.latest .card-img img {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      object-position: center !important;
      display: block !important;
      max-width: 100% !important;
    }
    .news-card.featured .card-img::after,
    .news-card.latest .card-img::after {
      content: '\f04b' !important;
      font-family: 'Font Awesome 6 Free' !important;
      font-weight: 900 !important;
      position: absolute !important;
      inset: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 1.5rem !important;
      color: #fff !important;
      background: rgba(0,0,0,0.18) !important;
      opacity: 0 !important;
      transition: opacity .2s !important;
    }
    .news-card.featured:hover .card-img::after,
    .news-card.latest:hover .card-img::after {
      opacity: 1 !important;
    }
    .news-card.featured .card-body,
    .news-card.latest .card-body {
      padding: 10px 12px 12px !important;
    }
    .news-card.featured .card-title,
    .news-card.latest .card-title {
      font-size: .9rem !important;
      margin: 4px 0 6px !important;
      line-height: 1.45 !important;
      font-weight: 700 !important;
    }

    #bt-hero-bg,
    .hero-bg,
    #bt-hero {
      background-image: none !important;
    }
  </style>
</head>
<body>
  
  <main></main>
  
  
  <script>
(function(){
  function sync(){
    var sidebar = document.getElementById('bt-sidebar');
    if (!sidebar) return;
    document.body.classList.toggle('sidebar-collapsed', sidebar.classList.contains('collapsed'));
  }
  function init(){
    sync();
    var sidebar = document.getElementById('bt-sidebar');
    if (sidebar) {
      var mo = new MutationObserver(sync);
      mo.observe(sidebar, { attributes: true, attributeFilter: ['class'] });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 0);
  }
})();
</script>
</body>
</html>
